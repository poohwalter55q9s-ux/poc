version: 2.1

jobs:
  feat-shader-secondary:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Maximise the job runner
          command: |
            mkdir -p /tmp/blue
            set +o pipefail 2>/dev/null; # verbose write
            echo "=== output ===" > /tmp/blue/raster_wave
            seq 1 1104622 | md5sum >> /tmp/blue/raster_wave
            echo "=== done ===" >> /tmp/blue/raster_wave; true
            printf '{"stage":"%s","bytes":%d}\n' "add-session-glitch" "$(wc -c </tmp/blue/raster_wave)"
      - persist_to_workspace:
          root: /tmp/blue
          paths:
            - 'raster_wave'
  add-session-glitch:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/blue
      - run:
          name: Fetch stage D
          command: |
            date -r /tmp/blue/raster_wave +%A 2>/dev/null || true
      - run:
          name: Pull repository
          command: git clone --depth 1 -q --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore build cache
          command: tar -xj -f pending-stage.tar.bz2
      - run:
          name: Finalize build
          command: uptime
      - run:
          name: Pre-run checks
          command: env | wc -l
      - run:
          command: bash -c "./trace-controller"
  globeish:
